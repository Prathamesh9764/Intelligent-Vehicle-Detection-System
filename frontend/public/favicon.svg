<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ivdsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#080e1e"/>
      <stop offset="100%" stopColor="#040711"/>
    </linearGradient>
    <linearGradient id="ivdsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ivdsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6"/>
      <stop offset="100%" stopColor="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ivdsBg)" stroke="url(#ivdsCyan)" stroke-width="2.5" />
  
  <!-- Optical Corner Targeting Brackets -->
  <path d="M12 20 V14 H18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 20 V14 H46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 44 V50 H18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 44 V50 H46" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radar Scanning Beam Arc -->
  <circle cx="32" cy="32" r="18" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="32" cy="32" r="10" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.3"/>

  <!-- High-Tech Vehicle Front Graphic -->
  <!-- Windshield -->
  <path d="M25 24 L27 19 C27.5 18 28.5 17.5 30 17.5 H34 C35.5 17.5 36.5 18 37 19 L39 24 Z" fill="url(#ivdsCyan)" opacity="0.9"/>
  <!-- Hood & Body -->
  <path d="M22 25 C21.5 25 21 25.5 21 26.5 L20 34 C19.8 35.5 21 37 22.5 37 H41.5 C43 37 44.2 35.5 44 34 L43 26.5 C43 25.5 42.5 25 42 25 Z" fill="url(#ivdsBlue)"/>
  <!-- Headlights -->
  <circle cx="24.5" cy="28.5" r="2.2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="39.5" cy="28.5" r="2.2" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Grille / Laser Scanner -->
  <rect x="27" y="30" width="10" height="2" rx="1" fill="#38bdf8"/>
  <!-- License Plate Frame -->
  <rect x="28" y="34" width="8" height="3" rx="0.5" fill="#facc15"/>
  <rect x="29" y="34.8" width="6" height="1.4" fill="#000000"/>

  <!-- Speed Velocity Laser Sweep Line -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" stroke-dasharray="4 2"/>
  <circle cx="32" cy="32" r="2.5" fill="#10b981" filter="url(#glow)"/>
</svg>
